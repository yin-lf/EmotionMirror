[project]
name = "emotionmirror"
version = "0.1.0"
description = "基于多模态情绪感知的数字分身系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	# Web framework
	"fastapi>=0.110.0",
	"pydantic>=2.13.0",
	"uvicorn[standard]>=0.29.0",
	"python-multipart>=0.0.9",

	# Voice emotion recognition (LSTM)
	"tensorflow>=2.15.0",
	"librosa>=0.10.0",
	"scikit-learn>=1.3.0",
	"joblib>=1.3.0",
	"pyyaml>=6.0",
	"soundfile>=0.12.0",

	# LivePortrait face animation
	"gradio>=5.1.0",
	"torch>=2.0.0",
	"torchvision>=0.15.0",
	"onnxruntime-gpu>=1.18.0",
	"opencv-python>=4.10.0",
	"transformers>=4.38.0",
	"insightface>=0.7.0",
	"dill>=0.3.0",

	# Image processing & GIF
	"imageio>=2.34.0",
	"imageio-ffmpeg>=0.5.0",
	"rembg>=2.0.0",
	"pillow>=10.2.0",
	"scikit-image>=0.24.0",
	"albumentations>=1.4.0",

	# Scientific computing
	"numpy>=1.24.0",
	"scipy>=1.13.0",
	"matplotlib>=3.9.0",

	# Utilities
	"tqdm>=4.66.0",
	"rich>=13.7.0",
	"lmdb>=1.4.0",
	"ffmpeg-python>=0.2.0",
	"onnx>=1.16.0",
	"pykalman>=0.9.0",
	"tyro>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/ylf/EmotionMirror"
